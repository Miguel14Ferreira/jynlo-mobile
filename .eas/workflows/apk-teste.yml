# APK de teste ligada à API de preview, para instalar diretamente no telemóvel.
# Corre no Expo EAS (não no GitHub Actions).
# Dispara só quando um commit no develop tem [jynlo-apk] na mensagem
# (por exemplo, no título do merge de um PR). Os outros pushes não gastam builds.
# Os testes correm no GitHub (workflow "Mobile tests") em cada PR e push ao develop;
# a suite está verde desde 2026-11-21.
name: APK de teste

on:
  push:
    branches: ['develop']

jobs:
  build_apk:
    name: APK (preview)
    if: ${{ contains(github.commit_message, '[jynlo-apk]') }}
    type: build
    params:
      platform: android
      profile: preview
