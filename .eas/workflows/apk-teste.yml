# APK de teste ligada à API de preview, para instalar diretamente no telemóvel.
# Corre no Expo EAS (não no GitHub Actions).
# Só manual (cada build além do plano da Expo é paga). Antes disparava com
# [jynlo-apk] na mensagem do commit, o que gerou dezenas de builds pagas.
# Não tem gate de testes: os testes correm localmente antes de cada merge,
# e a suite ainda tem 74 falhas antigas que bloqueariam a build.
name: APK de teste

on:
  workflow_dispatch: {}

jobs:
  build_apk:
    name: APK (preview)
    type: build
    params:
      platform: android
      profile: preview
