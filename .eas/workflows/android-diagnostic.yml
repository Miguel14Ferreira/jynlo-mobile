name: Jynlo Android - diagnostico manual

# Manual only. The Android build starts ONLY after tests, TypeScript and
# native prebuild all succeed. No GitHub Actions runner is required.
on:
  workflow_dispatch: {}

jobs:
  mobile_preflight:
    name: Validar codigo antes de gastar uma build Android
    environment: preview
    env:
      EXPO_PUBLIC_JYNLO_API_URL: https://desporto24-preview-api.onrender.com
      JYNLO_REQUIRE_REAL_API: '1'
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Confirmar API real
        run: node scripts/verify-release.cjs
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Executar todos os testes
        run: |
          set +e
          npm run test:all > /tmp/jynlo-android-tests.log 2>&1
          status=$?
          grep -E '^not ok [0-9]+ - |^# (tests|pass|fail|duration_ms)' /tmp/jynlo-android-tests.log || true
          if [ "$status" -ne 0 ]; then
            awk '/^not ok [0-9]+ - /{print; bad=1;next} bad && /^  (location:|error:)/{print} bad && /^  \\.\\.\\.$/{bad=0}' /tmp/jynlo-android-tests.log
          fi
          exit "$status"
      - name: Validar bundle Android
        run: npx expo export --platform android --output-dir /tmp/jynlo-android-diagnostic-bundle
      - name: Validar geracao do projeto nativo
        run: npx expo prebuild --platform android --no-install --clean

  android_diagnostic:
    name: Gerar APK interna de diagnostico (sem R8)
    needs: [mobile_preflight]
    environment: preview
    type: build
    params:
      platform: android
      profile: diagnostic
