          node scripts/check-eas-project.cjs
          npm run typecheck
          # Diagnostic IPA only. The strict TestFlight workflow still runs
          # the full suite; do not publish this build without resolving it.
          npm run test:syntax
          node --test tests/api-origin-security.test.cjs tests/security-api-transport.test.cjs tests/response-body.test.cjs tests/post-album.test.cjs tests/story-sticker-bounds.test.cjs tests/picker-media-content-uri.test.cjs
      - name: Gerar projeto nativo iOS
        script: |
          set -eu
          bash scripts/prepare-jynlo-icon.sh
          npx --no-install expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Aplicar assinatura Apple (App Store/TestFlight)
