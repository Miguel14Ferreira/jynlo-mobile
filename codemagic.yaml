# Jynlo Android QA APK; run manually from develop in Codemagic.
# Does not publish to Google Play, use EAS credits or access production API.
# Default Expo prebuild signs assembleRelease with a DEBUG keystore.
# This APK is for testing only and will not upgrade the EAS-signed APK in place.
workflows:
  jynlo-mobile-validacao:
    name: Jynlo Mobile - Validar TypeScript e testes (develop, sem APK)
    # Manual only: no automatic triggers and no Android native compilation.
    # The macOS M2 instance is eligible for the Codemagic personal free allocation.
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      node: v22.23.1
      vars:
        CI: "1"
        EXPO_PUBLIC_JYNLO_API_URL: "https://desporto24-preview-api.onrender.com"
        JYNLO_REQUIRE_REAL_API: "1"
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Garantir que a branch é develop
        script: |
          set -eu
          test "${CM_BRANCH:-}" = "develop" || { echo "Selecionar apenas develop."; exit 1; }
          mkdir -p build-metadata/ci-mobile
          echo "Branch: $CM_BRANCH"
          node --version
          npm --version
      - name: Instalar dependências sem executar scripts nativos
        script: |
          set -o pipefail
          npm install --no-audit --no-fund --ignore-scripts 2>&1 | tee build-metadata/ci-mobile/install.log
      - name: Verificar TypeScript e testes da Jynlo
        script: |
          set -o pipefail
          npm run typecheck 2>&1 | tee build-metadata/ci-mobile/typescript.log
          trap 'node scripts/summarize-node-tests.cjs build-metadata/ci-mobile/tests.log build-metadata/ci-mobile/test-failures.txt || true' EXIT
          npm run test:all 2>&1 | tee build-metadata/ci-mobile/tests.log
      - name: Verificar Expo e configuração de release
        script: |
          set -o pipefail
          {
            node scripts/verify-release.cjs
            node scripts/check-eas-project.cjs
            npx --no-install expo install --check
          } 2>&1 | tee build-metadata/ci-mobile/expo.log
    artifacts:
      - build-metadata/ci-mobile/*.log
      - build-metadata/ci-mobile/test-failures.txt

  jynlo-android-qa:
    name: Jynlo Android - APK de testes (develop)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: v22.23.1
      java: 17
      vars:
        CI: "1"
        EXPO_PUBLIC_JYNLO_API_URL: "https://desporto24-preview-api.onrender.com"
        JYNLO_REQUIRE_REAL_API: "1"
        JYNLO_ANDROID_DIAGNOSTIC_NO_R8: "1"
    scripts:
      - name: Confirmar branch e ferramentas
        script: |
          set -eu
          if [ "${CM_BRANCH:-}" != "develop" ]; then
            echo "Build bloqueada: utilizar exclusivamente a branch develop."
            exit 1
          fi
          node --version
          npm --version
          java -version
      - name: Instalar dependencias
        script: |
          set -eu
          npm install --no-audit --no-fund
      - name: Verificar app e compatibilidade
        script: |
          set -eu
          node scripts/verify-release.cjs
          node scripts/check-eas-project.cjs
          npx --no-install expo install --check
      - name: Testar TypeScript e contratos
        script: |
          set -euo pipefail
          mkdir -p build-metadata/ci-mobile
          npm run typecheck 2>&1 | tee build-metadata/ci-mobile/typescript.log
          trap 'node scripts/summarize-node-tests.cjs build-metadata/ci-mobile/tests.log build-metadata/ci-mobile/test-failures.txt || true' EXIT
          npm run test:all 2>&1 | tee build-metadata/ci-mobile/tests.log
      - name: Validar configuração nativa Android e Firebase opcional
        script: |
          set -eu
          # Use JYNLO_FIREBASE_ANDROID_JSON_B64 from an encrypted Codemagic
          # environment group, or GOOGLE_SERVICES_JSON as an existing file path.
          # The secret is decoded outside the checkout and never printed.
          node scripts/prepare-android-native-config.cjs
      - name: Preparar icone oficial e projeto Android
        script: |
          set -eu
          bash scripts/prepare-jynlo-icon.sh
          npx --no-install expo prebuild --platform android --no-install
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Gerar APK standalone (release de testes)
        script: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
      - name: Verificar pacote, versão e assinatura reais da APK
        script: |
          set -eu
          node scripts/verify-android-apk.cjs
      - name: Validar APK e gerar manifesto de distribuição
        script: |
          set -eu
          node scripts/android-qa-artifact-manifest.cjs
    artifacts:
      - build-metadata/ci-mobile/*.log
      - build-metadata/ci-mobile/test-failures.txt
      - build-metadata/jynlo-android-binary-verification.json
      - build-metadata/jynlo-android-qa.json
      - build-metadata/LEIA-ME-JYNLO-ANDROID-QA.txt
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt

