# Google Play CLOSED TESTING AAB: manual only, develop only.
# AAB is not uploaded automatically; preserve the existing Google Play upload key.
# Requires encrypted Codemagic group "jynlo_play_release" with:
#   EXPO_PUBLIC_JYNLO_API_URL              HTTPS production API (non-preview)
#   JYNLO_GOOGLE_MAPS_ANDROID_API_KEY      restricted Android Maps SDK key
#   JYNLO_FIREBASE_ANDROID_JSON_B64        Firebase JSON encoded as base64
#   JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64      SAME private upload JKS as Play versionCode 7
#   JYNLO_PLAY_UPLOAD_STORE_PASSWORD
#   JYNLO_PLAY_UPLOAD_KEY_ALIAS
#   JYNLO_PLAY_UPLOAD_KEY_PASSWORD
# Do not copy secrets to version control, and do not upload a test APK to Play.
  jynlo-android-google-play-closed:
    name: Jynlo Android - AAB Google Play teste fechado (develop)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - jynlo_play_release
      node: v22.23.1
      java: 17
      vars:
        CI: "1"
        JYNLO_REQUIRE_REAL_API: "1"
        JYNLO_REQUIRE_NATIVE_PUSH: "1"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Bloquear branches incorretas e segredos em falta
        script: |
          set -eu
          test "${CM_BRANCH:-}" = "develop" || { echo "Usar exclusivamente develop."; exit 1; }
          for variable in EXPO_PUBLIC_JYNLO_API_URL JYNLO_GOOGLE_MAPS_ANDROID_API_KEY JYNLO_FIREBASE_ANDROID_JSON_B64 JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64 JYNLO_PLAY_UPLOAD_STORE_PASSWORD JYNLO_PLAY_UPLOAD_KEY_ALIAS JYNLO_PLAY_UPLOAD_KEY_PASSWORD; do
            test -n "$(printenv "$variable" 2>/dev/null || true)" || { echo "Falta configurar variavel protegida: $variable"; exit 1; }
          done
          test "${JYNLO_ANDROID_DIAGNOSTIC_NO_R8:-0}" != "1" || { echo "Minificacao nao pode ser desativada."; exit 1; }
          node --version
          java -version
      - name: Dependencias e validacao completa
        script: |
          set -eu
          npm install --no-audit --no-fund
          node scripts/check-eas-project.cjs
          npm run typecheck
          npm run test:all
      - name: Configuracao Android Firebase e requisitos de producao
        script: |
          set -eu
          node scripts/prepare-android-native-config.cjs
      - name: Confirmar API de producao e integracoes nativas
        script: |
          set -eu
          node scripts/verify-release.cjs --production
      - name: Preparar projeto Android para compilacao Play
        script: |
          set -eu
          bash scripts/prepare-jynlo-icon.sh
          EAS_BUILD_PROFILE=play-internal npx --no-install expo prebuild --platform android --no-install
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Bloquear R8 na build corretiva do crash Android
        script: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re
          props = Path('android/gradle.properties').read_text()
          for setting in ('android.enableProguardInReleaseBuilds', 'android.enableShrinkResourcesInReleaseBuilds'):
              pattern = r'(?m)^' + re.escape(setting) + r'\s*=\s*false(?:\s|$)'
              if not re.search(pattern, props):
                  raise SystemExit(f'Build bloqueada: {setting} tem de estar explicitamente false em gradle.properties')
          print('R8 e resource shrink desativados no projeto nativo gerado.')
          PY
      - name: Configurar chave de upload Google Play sem a expor
        script: |
          set -eu
          # Certificado usado no AAB 0.16.0/versionCode 7, conforme auditoria do projeto.
          expected_sha256="7A55D817C089ECC4910761DFC1AE565F9E23B0A4E9CBB958FAA90F733999491A"
          keyfile="$(mktemp "${TMPDIR:-/tmp}/jynlo-play-upload.XXXXXX")"
          chmod 600 "$keyfile"
          printf '%s' "$JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -D > "$keyfile"
          test -s "$keyfile"
          export JYNLO_PLAY_UPLOAD_KEYSTORE_PATH="$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$JYNLO_PLAY_UPLOAD_STORE_PASSWORD" -alias "$JYNLO_PLAY_UPLOAD_KEY_ALIAS" >/dev/null 2>&1 || { echo "Chave upload/alias/password invalidos."; exit 1; }
          csr="$(mktemp "${TMPDIR:-/tmp}/jynlo-play-csr.XXXXXX")"
          trap 'rm -f "$csr"' EXIT
          keytool -certreq -keystore "$keyfile" -alias "$JYNLO_PLAY_UPLOAD_KEY_ALIAS" -storepass "$JYNLO_PLAY_UPLOAD_STORE_PASSWORD" -keypass "$JYNLO_PLAY_UPLOAD_KEY_PASSWORD" -file "$csr" >/dev/null 2>&1 || { echo "Password da chave privada incorreta."; exit 1; }
          actual_sha256="$(LC_ALL=C keytool -list -v -keystore "$keyfile" -storepass "$JYNLO_PLAY_UPLOAD_STORE_PASSWORD" -alias "$JYNLO_PLAY_UPLOAD_KEY_ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          test "$actual_sha256" = "$expected_sha256" || { echo "Certificado nao corresponde a upload key historica. NAO publicar."; exit 1; }
          printf 'JYNLO_PLAY_UPLOAD_KEYSTORE_PATH=%s\n' "$keyfile" >> "$CM_ENV"
          node scripts/configure-play-signing.cjs android/app/build.gradle
          echo "Certificado Play existente validado (sem divulgar chaves)."
      - name: Gerar AAB assinado para closed testing
        script: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --max-workers=2
      - name: Confirmar AAB e identidade antes do upload manual
        script: |
          set -eu
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          unzip -Z1 "$aab" | grep -q "^base/manifest/AndroidManifest.xml$"
          jarsigner -verify "$aab"
          actual_sha256="$(LC_ALL=C keytool -printcert -jarfile "$aab" | grep -m1 SHA256 | sed "s/.*SHA256: //" | tr -d ":" | tr "[:lower:]" "[:upper:]" | tr -d "[:space:]")"
          test "$actual_sha256" = "7A55D817C089ECC4910761DFC1AE565F9E23B0A4E9CBB958FAA90F733999491A" || { echo "AAB assinado com certificado errado."; exit 1; }
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/write-android-build-info.cjs aab
          shasum -a 256 "$aab" > build-metadata-jynlo-aab-sha256.txt
          echo "AAB validado: upload MANUAL apenas para closed testing."
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
      - android-build-info.json
      - build-metadata-jynlo-aab-sha256.txt

# iOS/TestFlight: manually run from develop, using the Codemagic Apple
# Developer Portal integration named "apple".
# Signing credentials live only in Codemagic/Apple, never in this repository.
  jynlo-ios-testflight:
    name: Jynlo iOS - IPA TestFlight (develop)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: apple
    environment:
      node: v22.23.1
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jynlo.app
      vars:
        CI: "1"
        EXPO_PUBLIC_JYNLO_API_URL: "https://desporto24-preview-api.onrender.com"
        JYNLO_REQUIRE_REAL_API: "1"
    scripts:
      - name: Confirmar branch e ferramentas
        script: |
          set -eu
          if [ "${CM_BRANCH:-}" != "develop" ]; then
            echo "Build iOS bloqueada: usar exclusivamente a branch develop."
            exit 1
          fi
          node --version
          xcodebuild -version
      - name: Instalar dependencias e validar app
        script: |
          set -eu
          npm install --no-audit --no-fund
          node scripts/verify-release.cjs
          node scripts/check-eas-project.cjs
          npm run typecheck
          npm run test:all
      - name: Gerar projeto nativo iOS
        script: |
          set -eu
          bash scripts/prepare-jynlo-icon.sh
          npx --no-install expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Aplicar assinatura Apple (App Store/TestFlight)
        script: |
          set -eu
          xcode-project use-profiles
      - name: Gerar IPA assinada
        script: |
          set -eu
          WORKSPACE="$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "Nao foi encontrado o workspace Xcode."
            exit 1
          fi
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload only after full test suite passes; beta review stays manual.
        submit_to_testflight: false
        submit_to_app_store: false

