name: Jynlo Android - percurso no emulador

# Compila a app ligada à API real, abre-a num emulador Android, entra com a
# conta de teste (secrets JYNLO_QA1_USERNAME / JYNLO_QA1_PASSWORD) e guarda
# capturas, vídeo e registos de erro como artefacto.
on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Idioma da app no emulador"
        type: choice
        options: [pt-PT, en-US]
        default: pt-PT
      flow:
        description: "Percurso a correr"
        type: choice
        options: [percurso, teclado, chamada]
        default: percurso

permissions:
  contents: write

concurrency:
  group: android-walkthrough
  cancel-in-progress: false

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      EXPO_PUBLIC_JYNLO_API_URL: "https://desporto24-preview-api.onrender.com"
    steps:
      - name: Verificar a conta de testes antes de compilar (uma tentativa)
        env:
          JYNLO_USER: ${{ secrets.JYNLO_QA1_USERNAME }}
          JYNLO_PASS: ${{ secrets.JYNLO_QA1_PASSWORD }}
        run: |
          if [ -z "$JYNLO_USER" ] || [ -z "$JYNLO_PASS" ]; then echo '::error::Faltam os secrets JYNLO_QA1_USERNAME/JYNLO_QA1_PASSWORD.'; exit 1; fi
          code=$(python3 -c 'import json,os;print(json.dumps({"username":os.environ["JYNLO_USER"],"password":os.environ["JYNLO_PASS"]}))' \
            | curl -s -o /dev/null -w '%{http_code}' --max-time 120 -H 'Content-Type: application/json' --data-binary @- "$EXPO_PUBLIC_JYNLO_API_URL/api/auth/login" || echo erro)
          echo "Login na API: HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::A API não aceitou a conta de testes (HTTP $code). Paro já, antes dos ~25 min de compilação."; exit 1; fi
      - name: Libertar espaço em disco (a compilação e o emulador precisam de ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/.ghcup || true
          echo "::notice::Disco livre no início: $(df -h / | awk 'NR==2{print $4}')"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar APK (assinatura de desenvolvimento, só para o emulador)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
      - name: Guardar APK e limpar ficheiros da compilação
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/jynlo.apk"
          rm -rf android/app/build/intermediates android/app/build/tmp android/build node_modules/.cache
          echo "::notice::Disco livre antes do emulador: $(df -h / | awk 'NR==2{print $4}')"
      - name: Escolher percurso
        env:
          QA_USER: ${{ secrets.JYNLO_QA1_USERNAME }}
          QA_PASS: ${{ secrets.JYNLO_QA1_PASSWORD }}
        run: |
          if [ -n "$QA_USER" ] && [ -n "$QA_PASS" ]; then
            echo "FLOW=.maestro/${{ inputs.flow || 'percurso' }}.yaml" >> "$GITHUB_ENV"
            echo "Conta de teste encontrada: percurso com sessão iniciada."
          else
            echo "FLOW=.maestro/visitante.yaml" >> "$GITHUB_ENV"
            echo "::warning::Sem JYNLO_QA1_USERNAME/JYNLO_QA1_PASSWORD neste repositório: percurso como visitante."
          fi
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar pasta de resultados
        run: mkdir -p walkthrough && echo "início $(date -u)" > walkthrough/estado.txt
      - name: Percurso no emulador
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          JYNLO_USER: ${{ secrets.JYNLO_QA1_USERNAME }}
          JYNLO_PASS: ${{ secrets.JYNLO_QA1_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-walkthrough.sh "${{ inputs.locale }}"
      - name: Guardar capturas, vídeo e registos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-android-percurso
          path: walkthrough/
          if-no-files-found: warn
          retention-days: 14
      # Results stay in the run (log + artifact): never create branches (only develop/master exist).
      - name: Resumo no registo
        if: always()
        run: |
          [ -f walkthrough/resumo.txt ] || exit 0
          grep -E "FAILED|COMPLETED|Assert" walkthrough/resumo.txt | tail -60 | sed 's/^/QA-PASSO /' | tee -a "$GITHUB_STEP_SUMMARY"
          # JS errors and small copies of the screenshots in the log, so the run can be reviewed
          # without downloading the artifact (the login is never captured).
          [ -f walkthrough/erros.txt ] && sed 's/^/QA-ERRO-JS /' walkthrough/erros.txt | head -40 || true
          pip install --quiet pillow >/dev/null 2>&1 || true
          python3 - <<'PY' || true
          import base64, glob, io, os
          from PIL import Image
          for f in sorted(glob.glob('walkthrough/screens/*.png')):
              im = Image.open(f).convert('RGB'); im.thumbnail((360, 800))
              b = io.BytesIO(); im.save(b, 'JPEG', quality=55)
              print('QA-IMG', os.path.splitext(os.path.basename(f))[0], base64.b64encode(b.getvalue()).decode())
          PY
      - name: Resultado do percurso
        if: always()
        run: |
          # Annotations are readable through the API even when raw logs are not.
          if [ -f walkthrough/resumo.txt ]; then
            while IFS= read -r line; do echo "::notice::$line"; done < <(tail -n 25 walkthrough/resumo.txt)
          else
            echo "::error::O percurso não chegou a começar (emulador não arrancou?)."
          fi
          [ "${{ steps.run.outcome }}" = "success" ] || exit 1
