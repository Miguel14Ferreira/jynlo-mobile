name: Build Jynlo Android preview APK
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-mobile-preview-apk
  cancel-in-progress: false

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_JYNLO_API_URL: https://desporto24-preview-api.onrender.com
      JYNLO_REQUIRE_REAL_API: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Expo access token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Configure an Expo access token before building."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo SDK dependency compatibility
        run: npx expo install --check
      - name: Run tests
        run: npm run test:all
      - name: Typecheck
        run: npm run typecheck
      - name: Reject demo backend for internal preview APK
        run: node scripts/verify-release.cjs
      - name: Verify effective Expo project linkage without EAS init
        run: node scripts/check-eas-project.cjs
      - name: Build Android preview APK and wait for result
        run: |
          date -u +%Y-%m-%dT%H:%M:00Z > eas-build-started-at.txt
          npx --yes eas-cli build --platform android --profile preview --non-interactive
      - name: Confirm completed Android build
        run: |
          npx --yes eas-cli build:list --platform android --build-profile preview --limit 1 --json --non-interactive > eas-preview-result.json
          node - <<'NODE'
          const fs = require('node:fs');
          const builds = JSON.parse(fs.readFileSync('eas-preview-result.json','utf8'));
          const build = builds[0];
          const startedAt = new Date(fs.readFileSync('eas-build-started-at.txt','utf8').trim());
          const createdAt = build?.createdAt ? new Date(build.createdAt) : null;
          if (!build || build.status !== 'FINISHED' || !build.artifacts?.buildUrl ||
              !createdAt || Number.isNaN(createdAt.getTime()) || createdAt < startedAt ||
              build.platform !== 'ANDROID' || build.buildProfile !== 'preview') {
            console.error('::error::Não foi possível confirmar uma APK Android concluída com URL de download.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `APK Jynlo pronta: ${build.artifacts.buildUrl}\n`);
          console.log('APK build confirmed');
          NODE
