name: Jynlo Mobile - Auth and TypeScript CI

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/mobile-auth-contract-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mobile:
    name: Validar contratos, expiração JWT e TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar contratos e sintaxe
        run: npm run test:all
      - name: Verificar TypeScript
        run: npm run typecheck
