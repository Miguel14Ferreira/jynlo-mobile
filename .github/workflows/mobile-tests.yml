# Typecheck + full contract/unit suite on every PR and push to develop.
# Green since 2026-11-21 (1780 tests); a failure here means a real regression.
name: Mobile tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run -s typecheck
      - run: npm run -s test:all
