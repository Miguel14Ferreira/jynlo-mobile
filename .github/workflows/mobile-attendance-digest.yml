name: Jynlo Mobile attendance digest parity
# Só manual: o repo é privado e cada run gasta minutos pagos do GitHub Actions.
# Os testes correm localmente (npm run test:all) antes de cada merge.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  attendance-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate attendance grouping and hide behavior
        run: node --test tests/attendance-digest.test.cjs
