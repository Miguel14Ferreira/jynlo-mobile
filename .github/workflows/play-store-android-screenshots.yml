name: Jynlo Play Store real Android screenshots

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/play-store-android-screenshots.yml

permissions:
  contents: read

jobs:
  capture:
    name: Capture real Android interface (isolated demo; no real user data)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: "true"
      # Intentionally omit EXPO_PUBLIC_JYNLO_API_URL: isolated demo content only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build isolated real Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EXPO_PUBLIC_JYNLO_API_URL:-}" ]; then
            echo "::error::Screenshots must not access real user data"
            exit 1
          fi
          npx expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew :app:assembleDebug --no-daemon --max-workers=2)
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Boot emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p play-store-screenshots
            adb shell am force-stop com.jynlo.app || true
            adb shell monkey -p com.jynlo.app 1
            sleep 20
            adb shell input keyevent KEYCODE_BACK || true
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://welcome' -p com.jynlo.app
            sleep 8
            adb exec-out screencap -p > play-store-screenshots/01-welcome.png
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://login' -p com.jynlo.app
            sleep 7
            adb exec-out screencap -p > play-store-screenshots/02-login.png
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://legal?document=privacy' -p com.jynlo.app
            sleep 7
            adb exec-out screencap -p > play-store-screenshots/03-privacy.png
            # Basic pixel and format checks; human review is still required.
            python3 - <<'PY'
            from pathlib import Path
            import struct
            for path in sorted(Path('play-store-screenshots').glob('*.png')):
                data=path.read_bytes()
                assert len(data)>15000 and data[:8]==b'\x89PNG\r\n\x1a\n', f'Invalid image {path}'
                w,h=struct.unpack('>II',data[16:24])
                assert (w,h)==(1080,1920), (path,w,h)
                print(path,w,h,len(data))
            assert len(list(Path('play-store-screenshots').glob('*.png')))==3
            PY
      - name: Upload real screenshots for manual visual approval
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-google-play-android-screenshots-review
          path: play-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
