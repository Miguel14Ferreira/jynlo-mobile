name: Jynlo Play Store real Android screenshots

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/play-store-android-screenshots.yml

permissions:
  contents: read

jobs:
  capture:
    name: Capture real Android interface (isolated demo)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build standalone APK for screenshots without real user data
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EXPO_PUBLIC_JYNLO_API_URL:-}" ]; then
            echo "::error::Do not connect screenshot build to real users"
            exit 1
          fi
          npx expo prebuild --platform android --no-install --clean
          # This edit affects only the ephemeral screenshot runner, never
          # the signed APK/AAB production workflow.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          original = p.read_text()
          lines = original.splitlines(keepends=True)
          edited = 0
          for i, line in enumerate(lines):
              if line.lstrip().startswith('minifyEnabled '):
                  indentation = line[:len(line) - len(line.lstrip())]
                  lines[i] = indentation + 'minifyEnabled false\n'
                  edited += 1
              if line.lstrip().startswith('shrinkResources '):
                  indentation = line[:len(line) - len(line.lstrip())]
                  lines[i] = indentation + 'shrinkResources false\n'
          if edited != 1:
              raise SystemExit(f'Expected one generated minifyEnabled line, found {edited}')
          p.write_text(''.join(lines))
          PY
          (cd android && ./gradlew :app:assembleRelease --no-daemon --max-workers=2)
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | grep -Fx 'assets/index.android.bundle'
      - name: Reclaim build space before emulator installation
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p "$RUNNER_TEMP/jynlo-apk"
          cp "$apk" "$RUNNER_TEMP/jynlo-apk/app-release.apk"
          rm -rf node_modules android/.gradle android/build android/app/build "$HOME/.gradle/caches"
          mkdir -p android/app/build/outputs/apk/release
          cp "$RUNNER_TEMP/jynlo-apk/app-release.apk" "$apk"
          df -h /
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$free_kb" -lt 3500000 ]; then
            echo "::error::Emulator requires >=3.5GB free disk"
            exit 1
          fi
      - name: Boot emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            mkdir -p play-store-screenshots
            adb shell monkey -p com.jynlo.app 1
            sleep 20
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://welcome' -p com.jynlo.app
            sleep 8
            adb exec-out screencap -p > play-store-screenshots/01-welcome.png
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://login' -p com.jynlo.app
            sleep 7
            adb exec-out screencap -p > play-store-screenshots/02-login.png
            adb shell am start -W -a android.intent.action.VIEW -d 'jynlo://legal?document=privacy' -p com.jynlo.app
            sleep 7
            adb exec-out screencap -p > play-store-screenshots/03-privacy.png
            python3 - <<'PY'
            from pathlib import Path
            import struct
            images=sorted(Path('play-store-screenshots').glob('*.png'))
            assert len(images)==3, f'Expected 3 images, got {len(images)}'
            for p in images:
                data=p.read_bytes()
                assert len(data)>15000 and data[:8]==bytes.fromhex('89504e470d0a1a0a'),p
                assert struct.unpack('>II',data[16:24])==(1080,1920),p
                print(p,len(data))
            PY
      - name: Save screenshots for human review
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-google-play-android-screenshots-review
          path: play-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
