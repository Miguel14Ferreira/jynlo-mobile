name: Jynlo Mobile - Enviar AAB à Google Play (teste interno)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Verificar autenticação, verificar AAB assinado ou enviar a testes internos'
        required: true
        type: choice
        default: verify-auth
        options:
          - verify-auth
          - verify-artifact
          - upload
      build_run_id:
        description: 'ID da execução do workflow que gerou o AAB assinado'
        required: true
        type: string
      version:
        description: 'Versão esperada (ex.: 0.18.0)'
        required: true
        type: string
      version_code:
        description: 'versionCode esperado (ex.: 15)'
        required: true
        type: string
      commit:
        description: 'Commit completo de que o AAB foi gerado'
        required: true
        type: string
      notes:
        description: 'Notas da versão (pt-PT)'
        required: false
        default: 'Melhorias e correções para os testadores.'
        type: string
      confirm:
        description: 'Só para upload: escreve ENVIAR_JYNLO_TESTE_INTERNO'
        required: false
        default: ''
        type: string
      status:
        description: 'draft guarda na consola; completed disponibiliza aos testadores autorizados'
        required: true
        type: choice
        default: draft
        options:
          - draft
          - completed

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: jynlo-play-internal-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Validar OIDC e opcionalmente enviar o AAB
    if: ${{ github.ref == 'refs/heads/develop' && (inputs.action == 'verify-auth' || inputs.action == 'verify-artifact' || (inputs.action == 'upload' && inputs.confirm == 'ENVIAR_JYNLO_TESTE_INTERNO')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter código da Jynlo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Autenticar via GitHub OIDC (sem chave JSON)
        uses: google-github-actions/auth@v3
        with:
          project_id: jynlo-play-store
          workload_identity_provider: projects/955491875786/locations/global/workloadIdentityPools/jynlo-github/providers/github-actions
          service_account: jynlo-play-publisher@jynlo-play-store.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Instalar google-auth
        run: python3 -m pip install --disable-pip-version-check 'google-auth>=2.36,<3' 'requests>=2.31,<3'
      - name: Confirmar autenticação federada (sem publicar)
        shell: bash
        run: |
          python3 - <<'PY'
          import google.auth
          from google.auth.transport.requests import Request
          credentials, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/androidpublisher"])
          credentials.refresh(Request())
          if not credentials.valid:
              raise RuntimeError("Credenciais federadas inválidas")
          print("OIDC validado; nenhuma operação de publicação efetuada")
          PY
      - name: Transferir AAB original assinado no GitHub
        if: ${{ inputs.action == 'upload' || inputs.action == 'verify-artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: jynlo-google-play-internal-aab
          run-id: ${{ inputs.build_run_id }}
          repository: Miguel14Ferreira/jynlo-mobile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: play-artifact
      - name: Validar origem, versão, manifesto e SHA-256
        if: ${{ inputs.action == 'upload' || inputs.action == 'verify-artifact' }}
        env:
          V: ${{ inputs.version }}
          C: ${{ inputs.version_code }}
          G: ${{ inputs.commit }}
        run: python3 scripts/play_upload_internal.py --artifact-dir play-artifact --version "$V" --version-code "$C" --commit "$G"
      - name: Confirmar assinatura do AAB
        if: ${{ inputs.action == 'upload' || inputs.action == 'verify-artifact' }}
        run: jarsigner -verify play-artifact/android/app/build/outputs/bundle/release/app-release.aab
      - name: Confirmação de validação sem publicação
        if: ${{ inputs.action == 'verify-artifact' }}
        run: echo "AAB validado localmente; nenhum envio à Google Play foi efetuado"
      - name: Instalar biblioteca da API oficial Google Play
        if: ${{ inputs.action == 'upload' }}
        run: python3 -m pip install --disable-pip-version-check 'google-api-python-client>=2.160,<3' 'google-auth>=2.36,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Enviar exclusivamente para a faixa interna
        if: ${{ inputs.action == 'upload' }}
        env:
          RELEASE_STATUS: ${{ inputs.status }}
          V: ${{ inputs.version }}
          C: ${{ inputs.version_code }}
          G: ${{ inputs.commit }}
          N: ${{ inputs.notes }}
        shell: bash
        run: python3 scripts/play_upload_internal.py --artifact-dir play-artifact --apply --status "$RELEASE_STATUS" --version "$V" --version-code "$C" --commit "$G" --notes "$N"
