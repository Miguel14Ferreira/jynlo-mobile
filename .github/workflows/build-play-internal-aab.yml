name: Jynlo Mobile - Google Play Internal AAB (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escreve PREPARAR_BETA_REAL para construir um AAB conectado à API real"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jynlo-play-internal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-internal-aab:
    name: Gerar AAB assinado para testes internos
    if: ${{ github.ref == 'refs/heads/develop' && inputs.confirm == 'PREPARAR_BETA_REAL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      JYNLO_REQUIRE_REAL_API: "1"
      EXPO_PUBLIC_JYNLO_API_URL: "https://api.jynlosports.com"
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Confirmar branch e identidade de versão da Jynlo
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./app.json').expo.version")"
          test "$(node -p "require('./app.json').expo.android.package")" = "com.jynlo.app"
          node -e "const c=require('./app.json').expo.android.versionCode;if(!Number.isSafeInteger(c)||c<1)process.exit(1)"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar testes e TypeScript
        run: |
          npm run test:all
          npm run typecheck
      # Google Maps and Firebase live in the EAS "production" environment.
      # env:exec injects them only into these commands; values never reach the logs or the repo.
      - name: Validar API real e gerar Android nativo com a configuração de loja do EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FIREBASE_ANDROID_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN em falta nos secrets"; exit 1; }
          # The EAS copy of google-services.json is a "Secret" (unreadable outside EAS builds),
          # so this local Gradle build reads it from the GitHub secret GOOGLE_SERVICES_JSON.
          test -n "$FIREBASE_ANDROID_JSON" || { echo "::error::Adiciona o secret GOOGLE_SERVICES_JSON (conteúdo do google-services.json do Firebase) ao repositório."; exit 1; }
          firebase="$RUNNER_TEMP/google-services.json"
          printf '%s' "$FIREBASE_ANDROID_JSON" > "$firebase"
          npx --yes eas-cli@latest env:exec production --non-interactive \
            "export GOOGLE_SERVICES_JSON='$firebase' EXPO_PUBLIC_JYNLO_API_URL='$EXPO_PUBLIC_JYNLO_API_URL'; npm run check:release && npx expo prebuild --platform android --no-install --clean"
      - name: Carregar chave privada só para este runner
        env:
          JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          JYNLO_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_STORE_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64 JYNLO_PLAY_UPLOAD_STORE_PASSWORD JYNLO_PLAY_UPLOAD_KEY_PASSWORD JYNLO_PLAY_UPLOAD_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::A configuração protegida ${name} está em falta. Não será criado nenhum AAB."
              exit 1
            fi
          done
          target="$RUNNER_TEMP/jynlo-play-upload.jks"
          printf '%s' "$JYNLO_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$target"
          test -s "$target"
          chmod 600 "$target"
          echo "JYNLO_PLAY_UPLOAD_KEYSTORE_PATH=$target" >> "$GITHUB_ENV"
      - name: Validar chave e passwords antes do Gradle
        env:
          JYNLO_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_STORE_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$JYNLO_PLAY_UPLOAD_KEYSTORE_PATH"
          if ! keytool -list -keystore "$keystore" -storepass "$JYNLO_PLAY_UPLOAD_STORE_PASSWORD" -alias "$JYNLO_PLAY_UPLOAD_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::A keystore, a password de armazenamento ou o alias da chave não correspondem. Confirma os GitHub Actions Secrets."
            exit 1
          fi
          # Generate a temporary certificate request to verify the private-key password.
          # The CSR contains no private key and is never uploaded.
          csr="$RUNNER_TEMP/jynlo-upload-check.csr"
          trap 'rm -f "$csr"' EXIT
          if ! keytool -certreq -keystore "$keystore" -alias "$JYNLO_PLAY_UPLOAD_KEY_ALIAS" -storepass "$JYNLO_PLAY_UPLOAD_STORE_PASSWORD" -keypass "$JYNLO_PLAY_UPLOAD_KEY_PASSWORD" -file "$csr" >/dev/null 2>&1; then
            echo "::error::A chave privada não abriu com a password configurada. Confirma JYNLO_PLAY_UPLOAD_KEY_PASSWORD e JYNLO_PLAY_UPLOAD_STORE_PASSWORD."
            exit 1
          fi
          test -s "$csr"
          echo "Chave de assinatura validada antes da compilação."
      - name: Aplicar assinatura de envio à release gerada
        run: node scripts/configure-play-signing.cjs android/app/build.gradle
      - name: Gerar AAB release com assinatura do proprietário
        env:
          JYNLO_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_STORE_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_PASSWORD }}
          JYNLO_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.JYNLO_PLAY_UPLOAD_KEY_ALIAS }}
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2
        working-directory: android
      - name: Confirmar assinatura e conteúdo do AAB
        shell: bash
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          unzip -Z1 "$aab" | grep -q '^base/manifest/AndroidManifest.xml$'
          jarsigner -verify "$aab"
          echo "AAB assinado e gerado para TESTE INTERNO, não publicado."
      - name: Registar versao, origem e commit do AAB
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-android-build-info.cjs aab
          sha256sum "android/app/build/outputs/bundle/release/app-release.aab" > android-build-sha256.txt
      - name: Guardar AAB para envio manual à Play Console
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-google-play-internal-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-build-info.json
            android-build-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Apagar chave temporária do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/jynlo-play-upload.jks"
