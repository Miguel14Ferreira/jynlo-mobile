name: Jynlo mobile validation

on:
  push:
    branches: [develop]
    paths:
      - 'src/lib/mobile-push.ts'
      - 'src/lib/push-device-api.ts'
      - 'app/notifications.tsx'
      - 'app/(tabs)/explore.tsx'
      - 'tests/mobile-explore-map-list.test.cjs'
      - 'app/messages/**'
      - 'app/(tabs)/messages.tsx'
      - 'app/communities/**'
      - 'app/sessions/create.tsx'
      - 'app/tournaments/create.tsx'
      - 'app/tournaments/[communityId]/[id].tsx'
      - 'app/tournaments/[communityId]/[id]/teams.tsx'
      - 'app/tournaments/[communityId]/[id]/participants.tsx'
      - 'tests/mobile-tournament-participants-lifecycle.test.cjs'
      - 'tests/mobile-tournament-teams-lifecycle.test.cjs'
      - 'tests/mobile-tournament-detail-lifecycle.test.cjs'
      - 'tests/mobile-tournament-create-lifecycle.test.cjs'
      - 'tests/mobile-session-community-preselection.test.cjs'
      - 'src/lib/session-community-sports.cjs'
      - 'src/lib/session-community-sports.d.cts'
      - 'tests/mobile-session-community-sports.test.cjs'
      - 'src/lib/direct-call-api.ts'
      - 'tests/mobile-direct-call-contract.test.cjs'
      - 'src/lib/auth.tsx'
      - 'src/lib/google-credential.ts'
      - 'src/lib/google-auth-api.ts'
      - 'src/lib/token-expiry.cjs'
      - 'app/login.tsx'
      - 'app/google-onboarding.tsx'
      - 'app/mfa.tsx'
      - 'tests/mobile-google-auth-validation.test.cjs'
      - 'src/lib/championship-api.ts'
      - 'tests/mobile-championship-parity.test.cjs'
      - 'app/communities/[id]/championships/**'
      - 'src/lib/community-api.ts'
      - 'tests/mobile-community-detail-lifecycle.test.cjs'
      - 'src/components/ChatPdfComposer.tsx'
      - 'src/components/SecureChatAttachment.tsx'
      - 'src/lib/user-safety-api.ts'
      - 'tests/chat-pdf-upload.test.cjs'
      - 'tests/mobile-chat-community-parity.test.cjs'
      - 'src/lib/chat-pdf-attachment.ts'
      - 'src/lib/chat-api.ts'
      - 'src/lib/inbox-filter.cjs'
      - 'src/lib/inbox-filter.d.cts'
      - 'tests/mobile-inbox-filter.test.cjs'
      - 'tests/mobile-chat-pdf-lifecycle.test.cjs'
      - 'tests/mobile-direct-chat-lifecycle.test.cjs'
      - 'tests/mobile-inbox-lifecycle.test.cjs'
      - 'app/_layout.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'scripts/check-push-readiness.cjs'
      - 'tests/mobile-push*.test.cjs'
      - '.github/workflows/mobile-push-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: App contracts
        run: npm run test:all
      - name: Android JavaScript bundle
        env:
          EXPO_PUBLIC_JYNLO_API_URL: https://desporto24-preview-api.onrender.com
        run: npx expo export --platform android --output-dir /tmp/jynlo-android-bundle
      - name: Expo config and dependencies
        run: npx --yes expo-doctor
      - name: Validate native Android generation (LiveKit / WebRTC)
        run: npx expo prebuild --platform android --no-install --clean
      - name: Check EAS project binding
        env:
          EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID" ]]; then
            echo "::notice::No EAS project ID configured yet; push token registration remains unavailable."
          else
            npm run check:push
          fi
