name: Jynlo mobile validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: App contracts
        run: npm run test:all
      - name: Android JavaScript bundle
        env:
          EXPO_PUBLIC_JYNLO_API_URL: https://desporto24-preview-api.onrender.com
        run: npx expo export --platform android --output-dir /tmp/jynlo-android-bundle
      - name: Expo config and dependencies
        run: npx --yes expo-doctor
      - name: Validate native Android generation (LiveKit / WebRTC)
        run: npx expo prebuild --platform android --no-install --clean
      - name: Check EAS project binding
        env:
          EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$EXPO_PUBLIC_JYNLO_EAS_PROJECT_ID" ]]; then
            echo "::notice::No EAS project ID configured yet; push token registration remains unavailable."
          else
            npm run check:push
          fi
