name: Jynlo Mobile contracts
# GitHub-hosted Actions minutes are exhausted. Avoid a failed run on every
# develop commit until quota is available; local validation remains available.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-mobile-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Play Store release and Android App Link contracts
        run: node --test tests/release-guard.test.cjs tests/android-link-contract.test.cjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript syntax and behavior contracts
        run: npm run test:all
      - name: Validate TypeScript types
        run: npm run typecheck
