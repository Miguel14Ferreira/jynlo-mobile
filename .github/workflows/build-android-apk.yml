name: Jynlo Mobile - Android APK instalável (testes)

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

# Preservar compilacoes Android ja em execucao; a mais recente fica em fila.
# Uma execucao manual tem o seu proprio grupo e nao interrompe o CI de develop.
concurrency:
  group: android-apk-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('branch-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Testes de contrato, sintaxe e TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout do projeto mobile
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testes e validacao sintatica
        run: npm run test:all
      - name: Validar TypeScript
        run: npm run typecheck

  android-installable:
    name: Compilar APK autónoma para Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      # Nunca ligar uma compilacao de demonstração à producao.
      EXPO_PUBLIC_JYNLO_API_URL: ""
    steps:
      - name: Checkout do projeto mobile
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar APK release de testes (JavaScript incluido)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
        working-directory: android
      - name: Confirmar APK autonoma
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -Z1 "$apk" | grep -q '^assets/index.android.bundle$'
          ls -lh "$apk"
          echo "APK inclui o bundle JS. Assinatura de desenvolvimento; nao publicar na Play Store."
      - name: Guardar APK instalavel no Android
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-mobile-android-installable-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
