name: Jynlo Mobile - Android APK (testes)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - "app.json"
      - "eas.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Validar e compilar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout do projeto mobile
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testes e validacao sintatica
        run: npm run test:all
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar APK debug (nao publicar)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Guardar APK para instalacao de teste
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-mobile-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
