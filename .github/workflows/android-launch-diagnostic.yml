name: Jynlo Android launch diagnostic (signed APK)

on:
  workflow_run:
    workflows: ['Jynlo Mobile - Android APK assinada (testes internos)']
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'ID da execução do GitHub Actions que produziu a APK assinada a testar'
        required: true
        type: string
permissions:
  contents: read
  actions: read

jobs:
  launch-smoke:
    # A failed/cancelled build has no trustworthy signed APK to test.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact signed APK from successful workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launch-diagnostics/apk
          run_id="${{ github.event.workflow_run.id || inputs.apk_run_id }}"
          if [[ ! "$run_id" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo '::error::O identificador do run da APK deve ser um número válido.'
            exit 1
          fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n jynlo-mobile-signed-internal-apk -D launch-diagnostics/apk
          apk="$(find launch-diagnostics/apk -type f -name '*.apk' | head -n1)"
          test -n "$apk" && test -s "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Testing signed APK from run $run_id."
          echo "Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          if [ -f launch-diagnostics/apk/android-build-info.json ]; then
            cp launch-diagnostics/apk/android-build-info.json launch-diagnostics/apk-build-info.json
          fi
          echo "APK_SOURCE_RUN=$run_id" >> "$GITHUB_ENV"
      - name: Boot Android emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p launch-diagnostics
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell am force-stop com.jynlo.app || true
            adb shell monkey -p com.jynlo.app 1 > launch-diagnostics/launch.txt 2>&1 || true
            cat launch-diagnostics/launch.txt
            sleep 20
            # Threadtime includes PID, allowing JS errors to be attributed to Jynlo.
            adb logcat -d -v threadtime > launch-diagnostics/logcat.txt
            adb shell dumpsys activity activities > launch-diagnostics/activities.txt
            adb shell pidof com.jynlo.app > launch-diagnostics/pid.txt || true
            # A screenshot is useful evidence, but its failure must not hide
            # a Java/native crash in logcat or prevent the crash summary.
            if ! adb exec-out screencap -p > launch-diagnostics/launch.png; then
              echo 'Android screenshot unavailable; continuing crash diagnosis.' | tee launch-diagnostics/screenshot-warning.txt
            fi
            if [ ! -s launch-diagnostics/launch.png ]; then
              rm -f launch-diagnostics/launch.png
              echo 'Android screenshot empty; continuing crash diagnosis.' | tee -a launch-diagnostics/screenshot-warning.txt
            fi
            python3 - <<'PY'
            from pathlib import Path
            text = Path('launch-diagnostics/logcat.txt').read_text(errors='replace')
            lines = text.splitlines()
            # Android may log crashes from Google services or the emulator itself.
            # Associate fatal signatures with the Jynlo process before failing.
            fatal_indices = [i for i, line in enumerate(lines)
                             if 'FATAL EXCEPTION' in line or 'Fatal signal' in line]
            crashes = []
            for i in fatal_indices:
                # Keep each fatal incident isolated: another Android process
                # may crash immediately afterwards on an emulator.
                next_fatal = next((j for j in fatal_indices if j > i), len(lines))
                context = lines[i:min(i+60, next_fatal)]
                # A native libc fatal signal often identifies the process on
                # the signal line itself, without a nearby Java Process header.
                jynlo_native_signal = ('Fatal signal' in lines[i] and
                                       '(com.jynlo.app)' in lines[i])
                if jynlo_native_signal or any(
                    'Process: com.jynlo.app,' in line or
                    '>>> com.jynlo.app <<<' in line for line in context
                ):
                    crashes.append(lines[i])
            Path('launch-diagnostics/crash-summary.txt').write_text('\n'.join(crashes) if crashes else 'No Android fatal exception signature detected in launch window.\n')
            for line in crashes[:20]:
                print(line[:250])
            if crashes:
                raise SystemExit('Android fatal error detected during launch')
            # A package mentioned in the activity history is NOT proof that
            # it is still running. Check both the live PID and resumed Activity.
            pid = Path('launch-diagnostics/pid.txt').read_text().strip()
            if not pid or not all(part.isdigit() for part in pid.split()):
                raise SystemExit('Jynlo process exited or was never launched after 20 seconds')
            # React Native can display a fatal JS error while Android keeps
            # its Activity and process alive. Only flag severe lines belonging
            # to the current Jynlo PID (never unrelated emulator processes).
            import re
            app_pids = set(pid.split())
            js_errors = []
            for line in lines:
                match = re.match(r'^\S+\s+\S+\s+(\d+)\s+\d+\s+E\s+ReactNativeJS\s*:\s*(.*)$', line)
                if match and match.group(1) in app_pids and re.search(
                    r'(?:^|\b)(?:Error:|TypeError:|ReferenceError:|Invariant Violation|Unhandled JS Exception)', match.group(2)):
                    js_errors.append(line)
            Path('launch-diagnostics/js-errors.txt').write_text(
                '\n'.join(js_errors) + ('\n' if js_errors else 'No severe Jynlo ReactNativeJS errors detected.\n'))
            if js_errors:
                for line in js_errors[:20]:
                    print(line[:350])
                raise SystemExit('Jynlo raised a severe React Native JS error after launch')
            activity = Path('launch-diagnostics/activities.txt').read_text(errors='replace')
            resumed = [line for line in activity.splitlines()
                       if 'topResumedActivity=' in line or 'mResumedActivity:' in line]
            Path('launch-diagnostics/resumed-activity.txt').write_text(
                '\n'.join(resumed) + '\n')
            if not any('com.jynlo.app/' in line for line in resumed):
                raise SystemExit('Jynlo activity is not resumed in the foreground after 20 seconds')
            print('Android launch smoke: live Jynlo process, resumed activity and no fatal error.')
            PY
      - name: Upload Android launch diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-signed-apk-launch-diagnostics
          path: launch-diagnostics/
          if-no-files-found: warn
          retention-days: 7
