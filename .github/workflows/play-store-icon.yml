name: Jynlo Google Play official icon 512px
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/play-store-icon.yml
      - assets/approved-jynlo-icon.webp.base64
      - scripts/prepare-jynlo-icon.sh
permissions:
  contents: read
jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export user-approved Jynlo artwork as Google Play 512px PNG
        run: JYNLO_ICON_SIZE=512 JYNLO_ICON_OUTPUT=play-store-assets/jynlo-play-icon-512.png bash scripts/prepare-jynlo-icon.sh
      - name: Validate Play Store dimensions and file size
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const file=fs.readFileSync('play-store-assets/jynlo-play-icon-512.png');
          if(file.subarray(0,8).toString('hex')!=='89504e470d0a1a0a' ||
             file.readUInt32BE(16)!==512 || file.readUInt32BE(20)!==512 ||
             file.length>1024*1024)throw Error('Google Play icon must be 512x512 PNG, up to 1 MB.');
          console.log('Official Jynlo Google Play icon validated.');
          JS
      - name: Upload official Google Play icon
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-google-play-icon-512
          path: play-store-assets/jynlo-play-icon-512.png
          if-no-files-found: error
          retention-days: 30
