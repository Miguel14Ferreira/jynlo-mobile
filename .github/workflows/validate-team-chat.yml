name: Validate Jynlo Mobile team chat
# Manual-only until hosted Actions runner allocation is restored.
# This repository has no npm lockfile; npm ci / setup-node cache:npm
# would fail even after a runner becomes available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-team-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript compilation
        run: npm run typecheck
      - name: Mobile teams contract checks
        run: node --test tests/mobile-team-first-impression.test.cjs
