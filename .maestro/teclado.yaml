# Teclado em todos os campos de texto: escreve em cada um e fotografa com o teclado aberto.
# Gerado a partir dos placeholders dos ecrãs (scripts/qa/gerar-teclado.py). A sessão já foi iniciada.
appId: com.jynlo.app
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "(Início|Home)"
    timeout: 90000
# explore · Procurar por cidade…
- openLink: "jynlo://explore"
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element: 'Procurar por cidade….*'
    timeout: 12000
    optional: true
- tapOn:
    text: 'Procurar por cidade….*'
    optional: true
- inputText: "Teste teclado"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: K01_explore
- hideKeyboard
