# Percurso de utilização no emulador Android (já com sessão iniciada):
# fotografa os ecrãs principais. Passos marcados "optional" não falham o teste
# quando a conta não tem esse conteúdo (por exemplo, nenhuma conversa).
appId: com.jynlo.app
---
# A sessão já foi iniciada por .maestro/entrar.yaml (sem gravação nem capturas).
- launchApp:
    clearState: false
- tapOn:
    text: "(Aguardar|Wait)"
    optional: true
- extendedWaitUntil:
    visible: "(Início|Home)"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03_inicio
- scroll
- takeScreenshot: 04_inicio_scroll
- tapOn: "(Explorar|Explore)"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05_explorar
- scroll
- takeScreenshot: 06_explorar_jogos
- scrollUntilVisible:
    element: "(Mapa|Map)"
    timeout: 15000
    optional: true
- tapOn:
    text: "(Mapa|Map)"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 06b_explorar_mapa
- tapOn: "(Início|Home)"
- tapOn:
    text: "(As minhas sessões|My games|My sessions)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07_minhas_sessoes
- tapOn:
    text: "(Ver detalhes da sessão|See game details|View session details|See session details)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08_detalhe_jogo
- scroll
- takeScreenshot: 09_detalhe_jogo_scroll
- back
- back
# Ecrãs fora das abas: ligação direta da app (não depende de scroll nem de textos).
- openLink: "jynlo://tournaments"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 10_torneios
- openLink: "jynlo://messages"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 11_mensagens
- openLink: "jynlo://profile"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 12_perfil
- scrollUntilVisible:
    element: "(Mais opções|More options)"
    timeout: 20000
    optional: true
- tapOn:
    text: "(Mais opções|More options)"
    optional: true
- takeScreenshot: 13_mais_opcoes
- openLink: "jynlo://teams"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 14_equipas
- openLink: "jynlo://feedback"
- waitForAnimationToEnd
- takeScreenshot: 15_opiniao
- openLink: "jynlo://communities"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 16_comunidades
