# Percurso de utilização no emulador Android: entra com a conta de teste e
# fotografa os ecrãs principais. Passos marcados "optional" não falham o teste
# quando a conta não tem esse conteúdo (por exemplo, nenhuma conversa).
appId: com.jynlo.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 00_arranque
# Android 13+ pede autorização para notificações no primeiro arranque.
- tapOn:
    text: "(Allow|Permitir|PERMITIR|ALLOW)"
    optional: true
- extendedWaitUntil:
    visible: "(Entrar na Jynlo.*|Sign in to Jynlo.*|Explorar como visitante|Explore as a guest)"
    timeout: 90000
- takeScreenshot: 01_boas_vindas
- tapOn: "(Entrar na Jynlo.*|Sign in to Jynlo.*)"
- extendedWaitUntil:
    visible: "(Nome de utilizador|Username)"
    timeout: 20000
- takeScreenshot: 02_login
- tapOn: "(Nome de utilizador|Username)"
- inputText: ${JYNLO_USER}
- tapOn: "(Palavra-passe|Password)"
- inputText: ${JYNLO_PASS}
- hideKeyboard
- tapOn: "^(Entrar|Sign in)$"
- extendedWaitUntil:
    visible: "(Início|Home)"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03_inicio
- scroll
- takeScreenshot: 04_inicio_scroll
- tapOn: "(Explorar|Explore)"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05_explorar
- scroll
- takeScreenshot: 06_explorar_jogos
- tapOn: "(Início|Home)"
- tapOn:
    text: "(As minhas sessões|My games|My sessions)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07_minhas_sessoes
- tapOn:
    text: "(Ver detalhes da sessão|View session details|See session details)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 08_detalhe_jogo
- scroll
- takeScreenshot: 09_detalhe_jogo_scroll
- back
- back
- tapOn:
    text: "(Torneios|Tournaments)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 10_torneios
- back
- tapOn:
    text: "(Mensagens|Messages).*"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 11_mensagens
- tapOn: "(Perfil|Profile)"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 12_perfil
- scrollUntilVisible:
    element: "(Mais opções|More options)"
    timeout: 20000
    optional: true
- tapOn:
    text: "(Mais opções|More options)"
    optional: true
- takeScreenshot: 13_mais_opcoes
- tapOn:
    text: "(As minhas equipas|My teams)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 14_equipas
- back
- scrollUntilVisible:
    element: "(Enviar opinião|Send feedback).*"
    timeout: 20000
    optional: true
- tapOn:
    text: "(Enviar opinião|Send feedback).*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 15_opiniao
- back
- tapOn: "(Início|Home)"
- tapOn:
    text: "(Encontrar comunidades|Find communities)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 16_comunidades
